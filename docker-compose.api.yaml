# Somente o processo Rails (API); Sidekiq fica no outro deploy.
services:
  chatwoot_api:
    # chatwoot_prepare / migrate ficam no stack principal; aqui só o HTTP (entrypoint rails.sh exige um processo em "$@").
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    environment:
      <<: *variaveis
    image: ottiv/chatwoot:${VERSION}
    entrypoint: docker/entrypoints/rails.sh
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 5G
          cpus: '4.0'
        reservations:
          memory: 1G
          cpus: '0.5'
      placement:
        constraints:
          - node.role == manager

      labels:
        - traefik.enable=true

        - traefik.http.routers.chatwoot_api.rule=Host(`api.ottiv.io`)
        - traefik.http.routers.chatwoot_api.entrypoints=websecure
        - traefik.http.routers.chatwoot_api.tls.certresolver=le
        - traefik.http.routers.chatwoot_api.service=chatwoot_api
        - traefik.http.routers.chatwoot_api.middlewares=chatwoot-api-upload-buffer

        - traefik.http.services.chatwoot_api.loadbalancer.server.port=3000
        - traefik.http.services.chatwoot_api.loadbalancer.passhostheader=true

        # Middleware inline - Configurado para suportar uploads de até 200MB (nome único vs stack on.ottiv.io)
        - traefik.http.middlewares.chatwoot-api-upload-buffer.buffering.maxRequestBodyBytes=209715200
        - traefik.http.middlewares.chatwoot-api-upload-buffer.buffering.memRequestBodyBytes=4194304
        - traefik.http.middlewares.chatwoot-api-upload-buffer.buffering.maxResponseBodyBytes=209715200
        - traefik.http.middlewares.chatwoot-api-upload-buffer.buffering.memResponseBodyBytes=4194304
        - traefik.http.middlewares.chatwoot-api-upload-buffer.buffering.retryExpression=IsNetworkError() && Attempts() <= 2
        # Timeouts para uploads grandes (10 horas)
        - traefik.http.services.chatwoot_api.loadbalancer.responseForwarding.flushInterval=1ms

    volumes:
      - chatwoot_data:/app/storage
      - chatwoot_app:/app
      # Pasta com os arquivos do frontend (favicon, logo e outras)
      # - /root/apps/chatwoot/public:/app/public
    networks:
      - traefik
      - interna

volumes:
  chatwoot_data:
  chatwoot_app:

networks:
  traefik:
    external: true
    name: externa
  interna:
    external: true
    name: interna
