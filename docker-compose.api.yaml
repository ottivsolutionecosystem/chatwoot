# Stack Chatwoot em modo somente API (CW_API_ONLY_SERVER=true).
# Não expõe o SPA do dashboard em /app; root aponta para api#index.
# Baseado em docker-compose.auttus.yaml — use este compose no lugar do auttus quando
# o frontend for consumido externamente (ex.: app Flutter) e não for necessária a UI web.
#
# Não inclui chatwoot_worker: o Sidekiq já roda no stack principal (ex.: on.ottiv.io).
# Mesmo Redis/Postgres — a fila é compartilhada; não suba um segundo worker para o mesmo ambiente.
#
# FRONTEND_URL deve ser a URL pública desta instalação (a mesma do Traefik): webhooks
# (WhatsApp, Telegram, etc.), mailers e default_url_options usam isso.
# Push (browser + FCM): o link "abrir conversa" usa FRONTEND_URL, ou PUSH_NOTIFICATION_LINK_BASE
# se definido — útil para Universal Links / App Links do Flutter em outro host que espelhe o path /app/.../conversations/...
# O payload FCM também envia ids em notification.fcm_push_data para o app abrir a conversa sem depender da URL.

