# Backend de Teste
services:
  chatwoot_dev:
    #      && bundle exec rails db:migrate
    command: >
      sh -c "bundle exec rails db:chatwoot_prepare
      && bundle exec rails s -p 3000 -b 0.0.0.0"
    environment:
      <<: *variaveis
    image: ottiv/chatwoot-dev:${VERSION}
    entrypoint: docker/entrypoints/rails.sh
    # Após deploy trocar os comandos comentando, o prepare cria as tabelas do banco de dados e segundo expõe e executa o frontend na porta 3000 do container
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
      placement:
        constraints:
          - node.role == manager

      labels:
        - traefik.enable=true

        - traefik.http.routers.chatwoot_dev.rule=Host(`dev-chatwoot.ottiv.tech`)  # Ajuste para seu domínio de teste
        - traefik.http.routers.chatwoot_dev.entrypoints=websecure
        - traefik.http.routers.chatwoot_dev.tls.certresolver=le
        - traefik.http.routers.chatwoot_dev.service=chatwoot_dev
        - traefik.http.routers.chatwoot_dev.middlewares=upload-buffer-test

        - traefik.http.services.chatwoot_dev.loadbalancer.server.port=3000
        - traefik.http.services.chatwoot_dev.loadbalancer.passhostheader=true

        # Middleware inline - Configurado para suportar uploads de até 200MB
        - traefik.http.middlewares.upload-buffer-test.buffering.maxRequestBodyBytes=209715200
        - traefik.http.middlewares.upload-buffer-test.buffering.memRequestBodyBytes=4194304
        - traefik.http.middlewares.upload-buffer-test.buffering.maxResponseBodyBytes=209715200
        - traefik.http.middlewares.upload-buffer-test.buffering.memResponseBodyBytes=4194304
        - traefik.http.middlewares.upload-buffer-test.buffering.retryExpression=IsNetworkError() && Attempts() <= 2
        # Timeouts para uploads grandes (10 horas)
        - traefik.http.services.chatwoot_dev.loadbalancer.responseForwarding.flushInterval=1ms

    volumes:
      - chatwoot_dev_data:/app/storage  # Volume separado para testes
      - chatwoot_dev_app:/app
      # Pasta com os arquivos do frontend (favicon, logo e outras)
      # - /root/apps/chatwoot/public:/app/public
    networks:
      - externa
      - interna

  # Worker de Teste
  chatwoot_dev_worker:
    environment:
      <<: *variaveis
    image: ottiv/chatwoot-dev:${VERSION}
    command: bundle exec sidekiq -C config/sidekiq.yml
    volumes:
      - chatwoot_dev_data:/app/storage  # Volume separado para testes
      - chatwoot_dev_app:/app
      # Pasta com os arquivos do frontend (favicon, logo e outras)
      # - /root/apps/chatwoot/public:/app/public
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
      placement:
        constraints:
          - node.role == manager

    networks:
      - interna

  # Vite Dev Server
  vite-dev:
    environment:
      <<: *variaveis
      VITE_DEV_SERVER_HOST: "0.0.0.0"
      VITE_DEV_SERVER_PORT: "3036"
      VITE_HMR_HOST: "localhost"
      VITE_HMR_PORT: "3036"
    image: ottiv/chatwoot-dev:${VERSION}
    entrypoint: docker/entrypoints/vite.sh
    command: bin/vite dev
    volumes:
      - chatwoot_dev_data:/app/storage
      - chatwoot_dev_app:/app
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 4G
          cpus: '1.0'
      placement:
        constraints:
          - node.role == manager
    networks:
      - interna

volumes:
  chatwoot_dev_data:  # Volumes separados para não misturar com produção
  chatwoot_dev_app:

networks:
  externa:
    name: externa
    external: true
  interna:
    name: interna
    external: true

